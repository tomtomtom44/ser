<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dexter: New Blood - S01</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f1115;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px 60px;
      overflow-x: hidden;
    }
    h1 {
      font-size: 36px;
      margin-bottom: 8px;
      color: #e50914;
    }
    p.subtitle {
      color: #9ca3af;
      font-size: 18px;
      margin-bottom: 32px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }
    .ep-btn {
      background: #1a1d24;
      border: 3px solid transparent;
      border-radius: 12px;
      padding: 22px 26px;
      color: #fff;
      text-align: left;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s ease;
    }
    .ep-btn:focus, .ep-btn:hover {
      outline: none;
      border-color: #e50914;
      background: #252a34;
      transform: scale(1.02);
    }
    .ep-num {
      color: #e50914;
      font-weight: bold;
      margin-right: 12px;
    }
    /* Přehrávač přes celou obrazovku */
    #player-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 9999;
    }
    #player-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }
    #close-hint {
      position: fixed;
      top: 24px;
      right: 32px;
      background: rgba(20, 20, 20, 0.9);
      color: #fff;
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      z-index: 2147483647;
      cursor: pointer;
      border: 2px solid #e50914;
      box-shadow: 0 4px 15px rgba(0,0,0,0.8);
      opacity: 1;
      transition: opacity 0.5s ease;
    }
    #close-hint.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #top-sensor {
      position: fixed;
      top: 0;
      right: 0;
      width: 320px;
      height: 100px;
      z-index: 2147483646;
    }
  </style>
</head>
<body>

  <h1>Dexter: New Blood</h1>
  <p class="subtitle">1. série (10 epizod) • Vyber díl ovladačem a stiskni OK</p>

  <div class="grid" id="episodes"></div>

  <div id="player-overlay">
    <div id="top-sensor"></div>
    <button id="close-hint" onclick="closePlayer()">✕ Zavřít přehrávač (Zpět)</button>
    <iframe id="player-frame" allowfullscreen allow="autoplay; fullscreen"></iframe>
  </div>

  <script>
    const IMDB_ID = "tt14164730";
    const SEASON = 1;
    const EPISODE_TITLES = [
      "Cold Snap",
      "Storm of Fuck",
      "Smoke Signals",
      "H is for Hero",
      "Runaway",
      "Too Many Tuna Sandwiches",
      "Skin of Her Teeth",
      "Unfair Game",
      "The Family Business",
      "Sins of the Father"
    ];

    const container = document.getElementById("episodes");
    const overlay = document.getElementById("player-overlay");
    const frame = document.getElementById("player-frame");
    const closeHint = document.getElementById("close-hint");
    const topSensor = document.getElementById("top-sensor");
    let buttons = [];
    let lastFocusedIndex = 0;
    let hideTimeout = null;

    EPISODE_TITLES.forEach((title, index) => {
      const epNum = index + 1;
      const btn = document.createElement("button");
      btn.className = "ep-btn";
      btn.innerHTML = `<span><span class="ep-num">E${epNum.toString().padStart(2, '0')}</span>${title}</span><span>▶</span>`;
      btn.onclick = () => {
        lastFocusedIndex = index;
        openPlayer(epNum);
      };
      container.appendChild(btn);
      buttons.push(btn);
    });

    if (buttons.length > 0) buttons[0].focus();

    function showCloseHintTemporarily() {
      closeHint.classList.remove("hidden");
      if (hideTimeout) clearTimeout(hideTimeout);
      hideTimeout = setTimeout(() => {
        closeHint.classList.add("hidden");
      }, 5000);
    }

    function openPlayer(episode) {
      frame.src = `https://embedmaster.link/tv/${IMDB_ID}/${SEASON}/${episode}`;
      overlay.style.display = "block";
      showCloseHintTemporarily();
    }

    function closePlayer() {
      if (hideTimeout) clearTimeout(hideTimeout);
      overlay.style.display = "none";
      frame.src = "";
      if (buttons[lastFocusedIndex]) buttons[lastFocusedIndex].focus();
    }

    // Znovu zobrazit při najetí kurzorem do pravého horního rohu nebo stisku klávesy
    topSensor.addEventListener("mousemove", showCloseHintTemporarily);
    topSensor.addEventListener("mouseenter", showCloseHintTemporarily);
    window.addEventListener("mousemove", showCloseHintTemporarily);

    document.addEventListener("keydown", (e) => {
      if (overlay.style.display === "block") {
        // Tlačítko Zpět na Samsung Tizen (10009) nebo Escape
        if (e.keyCode === 10009 || e.key === "Escape" || e.key === "Backspace") {
          e.preventDefault();
          closePlayer();
          return;
        }
        // Jakékoliv jiné tlačítko na ovladači znovu ukáže tlačítko Zavřít na 5s
        showCloseHintTemporarily();
        return;
      }

      const activeIndex = buttons.indexOf(document.activeElement);
      if (activeIndex === -1) return;

      if (e.key === "ArrowRight" && activeIndex + 1 < buttons.length) {
        buttons[activeIndex + 1].focus();
      } else if (e.key === "ArrowLeft" && activeIndex - 1 >= 0) {
        buttons[activeIndex - 1].focus();
      } else if (e.key === "ArrowDown" && activeIndex + 2 < buttons.length) {
        buttons[activeIndex + 2].focus();
      } else if (e.key === "ArrowUp" && activeIndex - 2 >= 0) {
        buttons[activeIndex - 2].focus();
      }
    });
  </script>
</body>
</html>
