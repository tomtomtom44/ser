<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dexter: New Blood - S01</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f1115;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px 60px;
      overflow-x: hidden;
    }
    h1 {
      font-size: 36px;
      margin-bottom: 8px;
      color: #e50914;
    }
    p.subtitle {
      color: #9ca3af;
      font-size: 18px;
      margin-bottom: 32px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }
    .ep-btn {
      background: #1a1d24;
      border: 3px solid transparent;
      border-radius: 12px;
      padding: 22px 26px;
      color: #fff;
      text-align: left;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s ease;
    }
    .ep-btn:focus, .ep-btn:hover {
      outline: none;
      border-color: #e50914;
      background: #252a34;
      transform: scale(1.02);
    }
    .ep-num {
      color: #e50914;
      font-weight: bold;
      margin-right: 12px;
    }
    /* Přehrávač přes celou obrazovku */
    #player-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9999;
    }
    #player-frame {
      width: 100%;
      height: 100%;
      border: none;
    }
    #close-hint {
      position: fixed;
      top: 16px;
      right: 24px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 16px;
      z-index: 10000;
      cursor: pointer;
      border: 1px solid #444;
    }
  </style>
</head>
<body>

  <h1>Dexter: New Blood</h1>
  <p class="subtitle">1. série (10 epizod) • Vyber díl ovladačem a stiskni OK</p>

  <div class="grid" id="episodes"></div>

  <div id="player-overlay">
    <button id="close-hint" onclick="closePlayer()">✕ Zavřít přehrávač (Zpět)</button>
    <iframe id="player-frame" allowfullscreen allow="autoplay; fullscreen"></iframe>
  </div>

  <script>
    const IMDB_ID = "tt14164730";
    const SEASON = 1;
    const EPISODE_TITLES = [
      "Cold Snap",
      "Storm of Fuck",
      "Smoke Signals",
      "H is for Hero",
      "Runaway",
      "Too Many Tuna Sandwiches",
      "Skin of Her Teeth",
      "Unfair Game",
      "The Family Business",
      "Sins of the Father"
    ];

    const container = document.getElementById("episodes");
    const overlay = document.getElementById("player-overlay");
    const frame = document.getElementById("player-frame");
    let buttons = [];
    let lastFocusedIndex = 0;

    EPISODE_TITLES.forEach((title, index) => {
      const epNum = index + 1;
      const btn = document.createElement("button");
      btn.className = "ep-btn";
      btn.innerHTML = `<span><span class="ep-num">E${epNum.toString().padStart(2, '0')}</span>${title}</span><span>▶</span>`;
      btn.onclick = () => {
        lastFocusedIndex = index;
        openPlayer(epNum);
      };
      container.appendChild(btn);
      buttons.push(btn);
    });

    // Automatické zaměření 1. dílu pro ovladač TV
    if (buttons.length > 0) buttons[0].focus();

    function openPlayer(episode) {
      frame.src = `https://embedmaster.link/tv/${IMDB_ID}/${SEASON}/${episode}`;
      overlay.style.display = "block";
    }

    function closePlayer() {
      overlay.style.display = "none";
      frame.src = "";
      if (buttons[lastFocusedIndex]) buttons[lastFocusedIndex].focus();
    }

    // Ovládání šipkami a tlačítkem Zpět na Samsung ovladači
    document.addEventListener("keydown", (e) => {
      // Tlačítko Zpět na Samsung Tizen (10009) nebo Escape
      if (e.keyCode === 10009 || e.key === "Escape" || e.key === "Backspace") {
        if (overlay.style.display === "block") {
          e.preventDefault();
          closePlayer();
        }
        return;
      }

      const activeIndex = buttons.indexOf(document.activeElement);
      if (activeIndex === -1) return;

      if (e.key === "ArrowRight" && activeIndex + 1 < buttons.length) {
        buttons[activeIndex + 1].focus();
      } else if (e.key === "ArrowLeft" && activeIndex - 1 >= 0) {
        buttons[activeIndex - 1].focus();
      } else if (e.key === "ArrowDown" && activeIndex + 2 < buttons.length) {
        buttons[activeIndex + 2].focus();
      } else if (e.key === "ArrowUp" && activeIndex - 2 >= 0) {
        buttons[activeIndex - 2].focus();
      }
    });
  </script>
</body>
</html>
