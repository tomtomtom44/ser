<head>
  <meta charset="UTF-8">

  <style>
    :root {
      --bg-dark: #090b10;
      --surface: rgba(24, 28, 38, 0.78);
      --surface-hover: rgba(38, 44, 60, 0.95);
      --accent: #e50914;
      --accent-glow: rgba(229, 9, 20, 0.45);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --border-subtle: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Dynamické rozostřené pozadí podle vybraného titulu */
    #backdrop-layer {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center 20%;
      opacity: 0.25;
      filter: blur(18px) saturate(1.2);
      transform: scale(1.08);
      transition: background-image 0.5s ease, opacity 0.5s ease;
      z-index: 0;
      pointer-events: none;
    }

    #backdrop-gradient {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 75% 20%, rgba(9, 11, 16, 0.35) 0%, rgba(9, 11, 16, 0.92) 70%, #090b10 100%);
      z-index: 1;
      pointer-events: none;
    }

    .app-container {
      position: relative;
      z-index: 2;
      max-width: 1600px;
      margin: 0 auto;
      padding: 44px 64px 64px;
    }

    /* Horní lišta */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
      gap: 24px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .brand-badge {
      background: linear-gradient(135deg, #e50914 0%, #99060d 100%);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 1.5px;
      padding: 6px 12px;
      border-radius: 6px;
      text-transform: uppercase;
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    h1 {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.15;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 17px;
      margin-top: 6px;
    }

    .back-nav-btn {
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px 22px;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.18s ease;
    }

    .back-nav-btn:focus, .back-nav-btn:hover {
      outline: none;
      border-color: var(--accent);
      background: var(--surface-hover);
      box-shadow: 0 0 0 4px var(--accent-glow);
      transform: translateY(-2px);
    }

    /* Mřížka titulů s plakáty */
    .series-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 28px;
    }

    .series-card {
      background: var(--surface);
      border: 3px solid var(--border-subtle);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      text-align: left;
      color: #fff;
      display: flex;
      flex-direction: column;
      transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.2s ease, box-shadow 0.22s ease;
      position: relative;
    }

    .series-card:focus, .series-card:hover {
      outline: none;
      border-color: var(--accent);
      transform: scale(1.045);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.75), 0 0 0 4px var(--accent-glow);
      z-index: 5;
    }

    .poster-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #141821;
      overflow: hidden;
    }

    .poster-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .series-card:focus .poster-wrapper img,
    .series-card:hover .poster-wrapper img {
      transform: scale(1.05);
    }

    .poster-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(9, 11, 16, 0.95) 0%, rgba(9, 11, 16, 0.2) 45%, transparent 100%);
    }

    .rating-pill {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(9, 11, 16, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fbbf24;
      font-weight: 700;
      font-size: 14px;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .collection-pill {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(229, 9, 20, 0.88);
      backdrop-filter: blur(8px);
      color: #fff;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .series-info {
      padding: 16px 20px 20px;
      margin-top: -28px;
      position: relative;
      z-index: 2;
    }

    .series-title {
      font-size: 21px;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .series-meta {
      font-size: 14px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Hlavička detailu seriálu / kolekce */
    .detail-banner {
      display: flex;
      align-items: center;
      gap: 28px;
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 22px 28px;
      margin-bottom: 30px;
    }

    .detail-poster {
      width: 96px;
      height: 144px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .detail-text h2 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .detail-text p {
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1.45;
      max-width: 900px;
    }

    /* Mřížka sérií, epizod a filmů v kolekci */
    .items-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .item-btn {
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 3px solid var(--border-subtle);
      border-radius: 14px;
      padding: 22px 26px;
      color: #fff;
      text-align: left;
      font-size: 21px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      transition: all 0.16s ease;
    }

    .item-btn:focus, .item-btn:hover {
      outline: none;
      border-color: var(--accent);
      background: var(--surface-hover);
      transform: scale(1.02);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55), 0 0 0 3px var(--accent-glow);
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .ep-badge {
      background: rgba(229, 9, 20, 0.16);
      border: 1px solid rgba(229, 9, 20, 0.45);
      color: #ff4d57;
      font-weight: 700;
      font-size: 16px;
      padding: 6px 12px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .play-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      transition: background 0.16s ease;
    }

    .item-btn:focus .play-icon,
    .item-btn:hover .play-icon {
      background: var(--accent);
      color: #fff;
    }

    .card-meta {
      display: block;
      font-size: 15px;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: normal;
    }

    /* Přehrávač přes celou obrazovku */
    #player-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 9999;
    }

    #player-frame {
      position: relative;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }

    #close-hint {
      position: fixed;
      top: 24px;
      right: 32px;
      background: rgba(15, 18, 25, 0.92);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 14px 22px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      z-index: 2147483647;
      cursor: pointer;
      border: 2px solid var(--accent);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.85);
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    #close-hint.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #top-sensor {
      position: fixed;
      top: 0;
      right: 0;
      width: 340px;
      height: 110px;
      z-index: 2147483646;
    }
  </style>
</head>

        const onerrorAttr = item.fallbackPoster ? `onerror="this.onerror=null;this.src='${item.fallbackPoster}';"` : "";

          <div class="poster-wrapper">
            <img src="${item.poster}" ${onerrorAttr} alt="${item.title}" loading="lazy">
            <div class="poster-overlay"></div>
            ${badgeHtml}
            ${item.rating ? `<span class="rating-pill">★ ${item.rating}</span>` : ""}

            <div class="series-title">${item.title}</div>

              <span>•</span>

          </div>
        `;

        btn.onfocus = () => updateBackdrop(item.poster);
        btn.onmouseenter = () => updateBackdrop(item.poster);
        btn.onclick = () => {
          selectedSeriesIndex = index;
          if (item.type === "collection") {
            renderCollection(0);
          } else {
            renderSeasons(0);
          }
        };

        grid.appendChild(btn);
        focusableElements.push(btn);
      });

      calculateGridColumns();
      if (focusableElements[focusIdx]) {
        focusableElements[focusIdx].focus();
        updateBackdrop(SERIES_DATA[focusIdx].poster);
      }
    }

    function renderDetailBanner(item) {
      const onerrorAttr = item.fallbackPoster ? `onerror="this.onerror=null;this.src='${item.fallbackPoster}';"` : "";
      detailBannerContainer.innerHTML = `
        <div class="detail-banner">
          <img class="detail-poster" src="${item.poster}" ${onerrorAttr} alt="${item.title}">
          <div class="detail-text">
            <h2>${item.title} <span style="font-size: 17px; color: #9ca3af; font-weight: normal;">(${item.year})</span></h2>
            <p style="color: #fbbf24; font-size: 14px; font-weight: 600; margin-bottom: 8px;">★ ${item.rating} &nbsp;•&nbsp; <span style="color: #d1d5db;">${item.genre}</span></p>
            <p>${item.description}</p>
          </div>
        </div>
      `;
    }

    // 2A. Zobrazení filmů ve sbírce (např. James Bond)
    function renderCollection(focusIdx = 0) {
      currentView = "collection";
      const collection = SERIES_DATA[selectedSeriesIndex];
      updateBackdrop(collection.poster);
      navBackBtn.style.display = "inline-flex";
      pageTitle.textContent = collection.title;
      pageSubtitle.textContent = "Vyber film ze sbírky k přehrání";
      renderDetailBanner(collection);

      grid.className = "items-grid";
      grid.innerHTML = "";
      focusableElements = [navBackBtn];

      collection.movies.forEach((movie, index) => {
        const movieNum = index + 1;
        const btn = document.createElement("button");
        btn.className = "item-btn";
        btn.innerHTML = `
          <div class="item-left">
            <span class="ep-badge">#${movieNum.toString().padStart(2, '0')}</span>
            <div>
              <strong>${movie.title}</strong>
              <span class="card-meta">${movie.year} • ${movie.actor}</span>
            </div>
          </div>
          <div class="play-icon">▶</div>
        `;
        btn.onclick = () => {
          lastItemIndex = index;
          openMoviePlayer(movie.id);
        };
        grid.appendChild(btn);
        focusableElements.push(btn);
      });

      calculateGridColumns();
      const targetBtn = focusableElements[focusIdx + 1] || focusableElements[0];
      if (targetBtn) targetBtn.focus();
    }

    // 2B. Zobrazení sérií vybraného seriálu
    function renderSeasons(focusIdx = 0) {
      currentView = "seasons";
      const series = SERIES_DATA[selectedSeriesIndex];
      updateBackdrop(series.poster);
      navBackBtn.style.display = "inline-flex";
      pageTitle.textContent = series.title;
      pageSubtitle.textContent = "Vyber sérii ovladačem a stiskni OK";
      renderDetailBanner(series);

      grid.className = "items-grid";
      grid.innerHTML = "";
      focusableElements = [navBackBtn];

      series.seasons.forEach((season, index) => {
        const btn = document.createElement("button");
        btn.className = "item-btn";
        btn.innerHTML = `
          <div>
            <strong>${season.seasonNumber}. série</strong>
            <span class="card-meta">${season.episodes.length} epizod</span>
          </div>
          <div class="play-icon">▶</div>
        `;
        btn.onclick = () => {
          selectedSeasonIndex = index;
          renderEpisodes(0);
        };
        grid.appendChild(btn);
        focusableElements.push(btn);
      });

      calculateGridColumns();
      const targetBtn = focusableElements[focusIdx + 1] || focusableElements[0];
      if (targetBtn) targetBtn.focus();
    }

    // 3. Zobrazení epizod vybrané série
    function renderEpisodes(focusIdx = 0) {
      currentView = "episodes";
      const series = SERIES_DATA[selectedSeriesIndex];
      const season = series.seasons[selectedSeasonIndex];
      updateBackdrop(series.poster);
      navBackBtn.style.display = "inline-flex";
      pageTitle.textContent = `${series.title} – ${season.seasonNumber}. série`;
      pageSubtitle.textContent = "Vyber epizodu k přehrání";
      renderDetailBanner(series);

      grid.className = "items-grid";
      grid.innerHTML = "";
      focusableElements = [navBackBtn];

      season.episodes.forEach((epTitle, index) => {
        const epNum = index + 1;
        const btn = document.createElement("button");
        btn.className = "item-btn";
        btn.innerHTML = `
          <div class="item-left">
            <span class="ep-badge">E${epNum.toString().padStart(2, '0')}</span>
            <span>${epTitle}</span>
          </div>
          <div class="play-icon">▶</div>
        `;
        btn.onclick = () => {
          lastItemIndex = index;
          openTvPlayer(series.id, season.seasonNumber, epNum);
        };
        grid.appendChild(btn);
        focusableElements.push(btn);
      });

      calculateGridColumns();
      const targetBtn = focusableElements[focusIdx + 1] || focusableElements[0];
      if (targetBtn) targetBtn.focus();
    }

    function goBack() {
      if (currentView === "episodes") {
        renderSeasons(selectedSeasonIndex);
      } else if (currentView === "seasons" || currentView === "collection") {
        renderSeries(selectedSeriesIndex);
      }
    }

    function showCloseHintTemporarily() {
      closeHint.classList.remove("hidden");
      if (hideTimeout) clearTimeout(hideTimeout);
      hideTimeout = setTimeout(() => {
        closeHint.classList.add("hidden");
      }, 5000);
    }

    function openTvPlayer(imdbId, seasonNum, episodeNum) {
      frame.src = `https://embedmaster.link/tv/${imdbId}/${seasonNum}/${episodeNum}${PLAYER_PARAMS}`;
      overlay.style.display = "block";
      showCloseHintTemporarily();
    }

    function openMoviePlayer(imdbId) {
      frame.src = `https://embedmaster.link/movie/${imdbId}${PLAYER_PARAMS}`;
      overlay.style.display = "block";
      showCloseHintTemporarily();
    }

    function closePlayer() {
      if (hideTimeout) clearTimeout(hideTimeout);
      overlay.style.display = "none";
      frame.src = "";
      const targetBtn = focusableElements[lastItemIndex + 1] || focusableElements[0];
      if (targetBtn) targetBtn.focus();
    }

    topSensor.addEventListener("mousemove", showCloseHintTemporarily);
    topSensor.addEventListener("mouseenter", showCloseHintTemporarily);
    window.addEventListener("mousemove", showCloseHintTemporarily);
    window.addEventListener("resize", calculateGridColumns);

    document.addEventListener("keydown", (e) => {
      const isBackKey = (e.keyCode === 10009 || e.key === "Escape" || e.key === "Backspace");

      if (overlay.style.display === "block") {
        if (isBackKey) {
          e.preventDefault();
          closePlayer();
          return;
        }
        showCloseHintTemporarily();
        return;
      }

      if (isBackKey && currentView !== "series") {
        e.preventDefault();
        goBack();
        return;
      }

      const activeIndex = focusableElements.indexOf(document.activeElement);
      if (activeIndex === -1) {
        if (focusableElements.length > 0) focusableElements[0].focus();
        return;
      }

      calculateGridColumns();
      const hasBackBtn = (currentView !== "series");

      if (!hasBackBtn) {
        if (e.key === "ArrowRight" && activeIndex + 1 < focusableElements.length) {
          focusableElements[activeIndex + 1].focus();
        } else if (e.key === "ArrowLeft" && activeIndex - 1 >= 0) {
          focusableElements[activeIndex - 1].focus();
        } else if (e.key === "ArrowDown" && activeIndex + gridColumns < focusableElements.length) {
          focusableElements[activeIndex + gridColumns].focus();
        } else if (e.key === "ArrowUp" && activeIndex - gridColumns >= 0) {
          focusableElements[activeIndex - gridColumns].focus();
        }
      } else {
        if (activeIndex === 0) {
          if (e.key === "ArrowDown" && focusableElements.length > 1) {
            focusableElements[1].focus();
          }
        } else {
          if (e.key === "ArrowRight" && activeIndex + 1 < focusableElements.length) {
            focusableElements[activeIndex + 1].focus();
          } else if (e.key === "ArrowLeft") {
            if (activeIndex > 1) focusableElements[activeIndex - 1].focus();
          } else if (e.key === "ArrowDown" && activeIndex + gridColumns < focusableElements.length) {
            focusableElements[activeIndex + gridColumns].focus();
          } else if (e.key === "ArrowUp") {
            if (activeIndex - gridColumns >= 1) {
              focusableElements[activeIndex - gridColumns].focus();
            } else {
              focusableElements[0].focus();
            }
          }
        }
      }
    });

    renderSeries(0);
  </script>
</body>
</html>
